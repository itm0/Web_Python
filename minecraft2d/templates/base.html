<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Minecraft 2D{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <header class="topbar">
      <div>
        <p class="eyebrow">DAW · Flask · DOM</p>
        <h1>Minecraft 2D</h1>
      </div>
      <nav class="nav-links">
        {% if is_logged_in %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <form action="{{ url_for('logout') }}" method="post" class="logout-form">
          <button type="submit" class="nav-link-button">Logout</button>
        </form>
        {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Registo</a>
        {% endif %}
        <button id="theme-toggle" class="nav-theme-toggle" type="button" aria-pressed="false">Modo escuro</button>
      </nav>
    </header>

    {% if messages %}
      <div class="flash-stack">
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  </body>
</html>
