{% extends "base.html" %}
{% block title %}Ranking · Minecraft 2D{% endblock %}

{% block content %}
<section class="slots-section">
    <div class="section-header">
        <h2>Leaderboard (Top 10)</h2>
        <p>Os jogadores com mais recursos acumulados. Atualizado em tempo real!</p>
    </div>
    
    <div class="inventory-panel" style="margin-top: 1rem; width: 100%; max-width: 600px;">
        <ul id="ranking-list" style="list-style: none; padding: 0; margin: 0;">
            </ul>
    </div>
</section>

<script>
    //Buscar os dadosaaaaa
    function atualizarRanking() {
        fetch("{{ url_for('game.api_leaderboard') }}")
            .then(response => response.json())
            .then(data => {
                let lista = document.getElementById("ranking-list");
                lista.innerHTML = ""; // Limpar lista atual antes de renderizar

                // Percorrer o array de objetos devolvido pela BD 
                for (let i = 0; i < data.ranking.length; i++) {
                    let jogador = data.ranking[i];
                    
                    // Criar o elemento dinamicamente
                    let li = document.createElement("li");
                    li.classList.add("ranking-item");

                    let posicao = i + 1;
                    let textoPrefixo = posicao + "º ";

                    // Adicionar Badges 
                    if (posicao === 1) {
                        li.classList.add("badge-1");
                        textoPrefixo = "🥇 " + textoPrefixo;
                    } else if (posicao === 2) {
                        li.classList.add("badge-2");
                        textoPrefixo = "🥈 " + textoPrefixo;
                    } else if (posicao === 3) {
                        li.classList.add("badge-3");
                        textoPrefixo = "🥉 " + textoPrefixo;
                    }

                    // Definir o texto e adicionar ao DOM
                    li.textContent = textoPrefixo + jogador.username + " - " + jogador.score + " pontos";
                    lista.appendChild(li);
                }
            })
            .catch(erro => console.error("Erro ao carregar o ranking:", erro));
    }

    //Carregar os dados imediatamente ao abrir a página
    atualizarRanking();
    
    //Atualização em tempo real a cada 5 segundos
    setInterval(atualizarRanking, 5000);
</script>
{% endblock %}
